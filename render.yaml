services:
  - type: web
    name: event-planner-backend
    env: node
    plan: free
    buildCommand: pnpm install && pnpm --filter @event-planner/backend build
    startCommand: node apps/backend/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    autoDeploy: true
